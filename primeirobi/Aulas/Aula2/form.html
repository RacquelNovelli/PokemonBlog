<body>

    <form action="/url-api-back-end" method="post">

        <label for="nome">Informe seu Nome</label>
        <input type="text" id="nome" name="nome"
            placeholder="Nome" required maxlength="10" >

        <br>

         <label for="nome">Informe seu E-mail</label>

        <label for="nome">Informe sua senha</label>
