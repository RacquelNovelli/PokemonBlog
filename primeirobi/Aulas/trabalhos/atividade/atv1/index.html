<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <p>Conheça alguns Pokémon!</p>
    </header>

    <main class="pokemon-container">

        <div class="pokemon-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif" alt="Pikachu">
            <h2>Pikachu</h2>
            <p>Tipo: Elétrico</p>
        </div>

        <div class="pokemon-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/1.gif" alt="Bulbasaur">
            <h2>Bulbasaur</h2>
            <p>Tipo: Planta / Veneno</p>
        </div>

        <div class="pokemon-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/4.gif" alt="Charmander">
            <h2>Charmander</h2>
            <p>Tipo: Fogo</p>
        </div>

        <div class="pokemon-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/7.gif" alt="Squirtle">
            <h2>Squirtle</h2>
            <p>Tipo: Água</p>
        </div>

        <div class="pokemon-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/133.gif" alt="Eevee">
            <h2>Eevee</h2>
            <p>Tipo: Normal</p>
        </div>

        <div class="pokemon-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/143.gif" alt="Snorlax">
            <h2>Snorlax</h2>
            <p>Tipo: Normal</p>
        </div>

    </main>

    <footer>
        <p>Pokédex - Atividade de Desenvolvimento Web</p>
    </footer>

</body>
</html>
